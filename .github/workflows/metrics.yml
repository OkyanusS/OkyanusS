name: GitHub Metrics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/metrics.yml'
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Account and coding habits
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.DIVA }}
          user: OkyanusS
          filename: github-metrics.svg
          template: classic
          base: header, repositories, metadata
          config_timezone: Europe/Istanbul
          plugin_habits: 'yes'
          plugin_habits_facts: 'no'
          plugin_habits_charts: 'yes'
          plugin_errors_fatal: 'yes'
      - name: Isometric calendar and languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.DIVA }}
          user: OkyanusS
          filename: github-metrics-calendar.svg
          template: classic
          base: ''
          config_timezone: Europe/Istanbul
          config_order: isocalendar, languages
          plugin_isocalendar: 'yes'
          plugin_isocalendar_duration: half-year
          plugin_languages: 'yes'
          plugin_languages_details: percentage
          plugin_errors_fatal: 'yes'
